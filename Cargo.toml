[workspace]
resolver = "2"
members = [
    "crates/cadrion",
    "crates/cadrion-kernel",
    "crates/cadrion-lang",
    "crates/cadrion-model",
    "crates/cadrion-inspect",
    "crates/cadrion-cli",
    "crates/cadrion-bench",
    "crates/cadrion-render",
    "crates/cadrion-mcp",
    "crates/cadrion-parts",
    "crates/cadrion-api",
    "crates/cadrion-robot",
    "crates/cadrion-fab",
    "crates/cadrion-harness",
    "crates/cadrion-occt",
    "crates/cadrion-truck",
    "crates/cadrion-wasm",
    "crates/cadrion-sdf",
]
default-members = [
    "crates/cadrion",
    "crates/cadrion-kernel",
    "crates/cadrion-lang",
    "crates/cadrion-model",
    "crates/cadrion-inspect",
    "crates/cadrion-cli",
    "crates/cadrion-bench",
    "crates/cadrion-render",
    "crates/cadrion-mcp",
    "crates/cadrion-parts",
    "crates/cadrion-api",
    "crates/cadrion-robot",
    "crates/cadrion-fab",
    "crates/cadrion-harness",
    "crates/cadrion-truck",
    "crates/cadrion-wasm",
    "crates/cadrion-sdf",
]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/buckster123/Cadrion-RS"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
starlark = "0.14.2"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

cadrion-kernel = { path = "crates/cadrion-kernel" }
cadrion-lang = { path = "crates/cadrion-lang" }
cadrion-model = { path = "crates/cadrion-model" }
cadrion-inspect = { path = "crates/cadrion-inspect" }
cadrion-cli = { path = "crates/cadrion-cli" }
cadrion-bench = { path = "crates/cadrion-bench" }
cadrion-render = { path = "crates/cadrion-render" }
cadrion-mcp = { path = "crates/cadrion-mcp" }
cadrion-parts = { path = "crates/cadrion-parts" }
cadrion-api = { path = "crates/cadrion-api" }
cadrion-robot = { path = "crates/cadrion-robot" }
cadrion-fab = { path = "crates/cadrion-fab" }
cadrion-harness = { path = "crates/cadrion-harness" }
cadrion-occt = { path = "crates/cadrion-occt" }
cadrion-truck = { path = "crates/cadrion-truck" }
cadrion-wasm = { path = "crates/cadrion-wasm" }
cadrion-sdf = { path = "crates/cadrion-sdf" }

# H3: patched opencascade so cadrion-occt can BRep-transform without STEP I/O.
[patch.crates-io]
opencascade = { path = "third_party/opencascade" }

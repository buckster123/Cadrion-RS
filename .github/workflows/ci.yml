name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy (default members, no OCCT)
        run: cargo clippy -- -D warnings
      - name: test (default members, no OCCT)
        run: cargo test
      - name: build (default members, no OCCT)
        run: cargo build
      - name: skills export both agents
        run: cargo run -q -p cadrion-cli -- skills export --all -o /tmp/cadrion-skills --json
      - name: schema dump (D13)
        run: cargo run -q -p cadrion-cli -- schema --json

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: wasm32 build cadrion-wasm (browser)
        run: cargo build -p cadrion-wasm --target wasm32-unknown-unknown --features browser
      - name: wasm unit tests (host)
        run: cargo test -p cadrion-wasm

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: clippy (default members, no OCCT)
        run: cargo clippy -- -D warnings
      - name: test (default members, no OCCT)
        run: cargo test
      - name: build (default members, no OCCT)
        run: cargo build

  # Optional: enable when runners have OCCT prebuilts / cache budget.
  # occt:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: dtolnay/rust-toolchain@stable
  #     - run: cargo test -p cadrion-occt

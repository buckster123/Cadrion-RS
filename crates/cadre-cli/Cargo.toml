[package]
name = "cadre-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Cadre CLI — build / inspect / export"
default-run = "cadre"

[[bin]]
name = "cadre"
path = "src/main.rs"

[features]
default = []
# Real STEP/tessellation via Open CASCADE (LGPL). Requires CMake policy on CMake ≥ 4.
occt = ["dep:cadre-occt", "cadre-bench/occt"]
# H3-6: upstream truck B-rep spike (optional; never default / never parity).
truck-brep = ["cadre-truck/brep"]

[dependencies]
anyhow = { workspace = true }
cadre-inspect = { workspace = true }
cadre-kernel = { workspace = true }
cadre-lang = { workspace = true }
cadre-model = { workspace = true }
cadre-bench = { workspace = true }
cadre-render = { workspace = true }
cadre-mcp = { workspace = true }
cadre-api = { workspace = true }
cadre-robot = { workspace = true }
cadre-fab = { workspace = true }
cadre-harness = { workspace = true }
cadre-parts = { workspace = true }
cadre-truck = { workspace = true }
cadre-sdf = { workspace = true }
clap = { version = "4", features = ["derive", "env"] }
serde = { workspace = true }
serde_json = { workspace = true }
serde_path_to_error = "0.1"
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

cadre-occt = { workspace = true, optional = true }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

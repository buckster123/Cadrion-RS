[package]
name = "cadrion-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Cadrion CLI — build / inspect / export"
default-run = "cadrion"

[[bin]]
name = "cadrion"
path = "src/main.rs"

[features]
default = []
# Real STEP/tessellation via Open CASCADE (LGPL). Requires CMake policy on CMake ≥ 4.
occt = ["dep:cadrion-occt", "cadrion-bench/occt", "cadrion-mcp/occt"]
# H3-6: upstream truck B-rep spike (optional; never default / never parity).
truck-brep = ["cadrion-truck/brep", "cadrion-mcp/truck-brep"]

[dependencies]
anyhow = { workspace = true }
cadrion-inspect = { workspace = true }
cadrion-kernel = { workspace = true }
cadrion-lang = { workspace = true }
cadrion-model = { workspace = true }
cadrion-bench = { workspace = true }
cadrion-render = { workspace = true }
cadrion-mcp = { workspace = true }
cadrion-api = { workspace = true }
cadrion-robot = { workspace = true }
cadrion-fab = { workspace = true }
cadrion-harness = { workspace = true }
cadrion-parts = { workspace = true }
cadrion-truck = { workspace = true }
cadrion-sdf = { workspace = true }
clap = { version = "4", features = ["derive", "env"] }
serde = { workspace = true }
serde_json = { workspace = true }
serde_path_to_error = "0.1"
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

cadrion-occt = { workspace = true, optional = true }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

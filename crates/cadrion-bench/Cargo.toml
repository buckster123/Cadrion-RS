[package]
name = "cadrion-bench"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Parity suite runner for Cadrion-RS (parts 1–N deterministic checks)"

[features]
default = []
occt = ["dep:cadrion-occt"]

[dependencies]
cadrion-inspect = { workspace = true }
cadrion-kernel = { workspace = true }
cadrion-lang = { workspace = true }
cadrion-occt = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

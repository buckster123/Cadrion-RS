[package]
name = "cadrion-wasm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "WASM escape hatch: Starlark→IR + mock facts (no OCCT)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cadrion-kernel = { workspace = true }
cadrion-lang = { workspace = true }
cadrion-inspect = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Pull wasm_js for the whole graph (starlark → getrandom 0.4).
getrandom = { version = "0.4", features = ["wasm_js"] }
wasm-bindgen = { version = "0.2", optional = true }

[features]
default = []
browser = ["dep:wasm-bindgen"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

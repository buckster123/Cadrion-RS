<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Cadrion WASM sketch (H2-1)</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 52rem; margin: 2rem auto; padding: 0 1rem; }
    textarea { width: 100%; min-height: 12rem; font-family: ui-monospace, monospace; }
    pre { background: #111; color: #ddd; padding: 1rem; overflow: auto; }
    .note { color: #666; font-size: 0.9rem; }
  </style>
</head>
<body>
  <h1>Cadrion WASM <span class="note">mock-only · non-parity</span></h1>
  <p class="note">
    Build pack first:
    <code>wasm-pack build crates/cadrion-wasm --target web --features browser</code>
    then point the import below at the generated module. This page is a sketch, not a bundler.
  </p>
  <textarea id="src">
P = params(w=40.0, d=20.0, h=10.0)
def gen_step():
    return solid(box(P.w, P.d, P.h, at=CENTER), label="block")
</textarea>
  <p>
    <button id="run" type="button">build (needs wasm module)</button>
  </p>
  <pre id="out">// click build after wiring import</pre>
  <script type="module">
    // Uncomment after wasm-pack:
    // import init, { build, info } from "../../pkg/cadrion_wasm.js";
    // await init();
    // document.getElementById("out").textContent = info();
    document.getElementById("run").onclick = () => {
      document.getElementById("out").textContent =
        "Wire wasm-pack output (see docs/WASM.md). Native proof: cargo test -p cadrion-wasm";
    };
  </script>
</body>
</html>
